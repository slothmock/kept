services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: kept_test
      POSTGRES_USER: kept
      POSTGRES_PASSWORD: kept_local_dev
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kept -d kept_test"]
      interval: 2s
      timeout: 3s
      retries: 15
    tmpfs:
      - /var/lib/postgresql/data

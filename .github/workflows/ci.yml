name: CI

on:
  pull_request:
    branches:
      - staging
      - main
  push:
    branches:
      - staging
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  unit:
    name: Parallel unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm
      - run: npm ci
      - run: npm run test:unit

  integration:
    name: Serial infrastructure tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: ghcr.io/knex/postgres:17-alpine
        env:
          POSTGRES_DB: kept_test
          POSTGRES_USER: kept
          POSTGRES_PASSWORD: kept_local_dev
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U kept -d kept_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql://kept:kept_local_dev@127.0.0.1:55432/kept_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm
      - run: npm ci
      - run: npm run test:infrastructure

  web:
    name: Web lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm
      - run: npm ci
      - run: npm --workspace @kept/web run lint
      - run: npm --workspace @kept/web run build

  app:
    name: App checks
    runs-on: ubuntu-latest
    needs:
      - typecheck
      - unit
      - integration
      - web
    if: ${{ always() }}
    steps:
      - name: Verify parallel app checks
        env:
          TYPECHECK_RESULT: ${{ needs.typecheck.result }}
          UNIT_RESULT: ${{ needs.unit.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          WEB_RESULT: ${{ needs.web.result }}
        run: |
          for result in "$TYPECHECK_RESULT" "$UNIT_RESULT" "$INTEGRATION_RESULT" "$WEB_RESULT"; do
            if [ "$result" != "success" ]; then
              echo "App checks failed or did not complete: $result"
              exit 1
            fi
          done

  contracts:
    name: Contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge test --root packages/contracts

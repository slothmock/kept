name: CI

on:
  pull_request:
    branches:
      - staging
      - main
      - prod
  push:
    branches:
      - staging
      - main
      - prod

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  unit:
    name: Parallel unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm
      - run: npm ci
      - run: npm run test:unit

  integration:
    name: Serial infrastructure tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: ghcr.io/knex/postgres:17-alpine
        env:
          POSTGRES_DB: kept_test
          POSTGRES_USER: kept
          POSTGRES_PASSWORD: kept_local_dev
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U kept -d kept_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql://kept:kept_local_dev@127.0.0.1:55432/kept_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm
      - run: npm ci
      - run: npm run test:infrastructure

  web:
    name: Web lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm
      - run: npm ci
      - run: npm --workspace @kept/web run lint
      - run: npm --workspace @kept/web run build

  app:
    name: App checks
    runs-on: ubuntu-latest
    needs:
      - typecheck
      - unit
      - integration
      - web
    if: ${{ always() }}
    steps:
      - name: Verify parallel app checks
        env:
          TYPECHECK_RESULT: ${{ needs.typecheck.result }}
          UNIT_RESULT: ${{ needs.unit.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          WEB_RESULT: ${{ needs.web.result }}
        run: |
          for result in "$TYPECHECK_RESULT" "$UNIT_RESULT" "$INTEGRATION_RESULT" "$WEB_RESULT"; do
            if [ "$result" != "success" ]; then
              echo "App checks failed or did not complete: $result"
              exit 1
            fi
          done

  contracts:
    name: Contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge test --root packages/contracts

  production-web-deploy:
    name: Deploy production web after API
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/prod' }}
    needs:
      - typecheck
      - unit
      - integration
      - web
      - contracts
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      VERCEL_PRODUCTION_DEPLOY_HOOK: ${{ secrets.VERCEL_PRODUCTION_DEPLOY_HOOK }}
      RAILWAY_PROJECT_ID: eab1644d-12af-481b-b807-d62762eed04d
      RAILWAY_ENVIRONMENT_ID: 38700de1-78bf-4f9d-9ba9-73d03f2bb744
      RAILWAY_SERVICE_ID: 2f212b30-6b38-4eb7-8232-a76cea3f8e9d
    steps:
      - name: Confirm production deployment secrets
        run: |
          test -n "$RAILWAY_API_TOKEN" || { echo "::error::Missing RAILWAY_API_TOKEN secret"; exit 1; }
          test -n "$VERCEL_PRODUCTION_DEPLOY_HOOK" || { echo "::error::Missing VERCEL_PRODUCTION_DEPLOY_HOOK secret"; exit 1; }
      - name: Wait for Railway to deploy this exact commit
        shell: bash
        run: |
          set -euo pipefail
          query='query($input: DeploymentListInput!) { deployments(first: 5, input: $input) { edges { node { status meta } } } }'
          for attempt in $(seq 1 60); do
            payload=$(jq -nc \
              --arg query "$query" \
              --arg projectId "$RAILWAY_PROJECT_ID" \
              --arg environmentId "$RAILWAY_ENVIRONMENT_ID" \
              --arg serviceId "$RAILWAY_SERVICE_ID" \
              '{query:$query,variables:{input:{projectId:$projectId,environmentId:$environmentId,serviceId:$serviceId}}}')
            response=$(curl --fail --silent --show-error --max-time 15 \
              -H "Authorization: Bearer $RAILWAY_API_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$payload" https://backboard.railway.com/graphql/v2)
            if ! echo "$response" | jq -e '.data.deployments.edges | type == "array"' >/dev/null; then
              echo "::error::Railway deployment query returned an invalid response"
              echo "$response" | jq '{errors: .errors}' || true
              exit 1
            fi
            latest=$(echo "$response" | jq -c '.data.deployments.edges[0].node // {}')
            sha=$(echo "$latest" | jq -r '.meta.commitHash // ""')
            status=$(echo "$latest" | jq -r '.status // ""')
            echo "Railway deployment: status=$status, commit=$sha; expected=$GITHUB_SHA"
            if [[ "$sha" == "$GITHUB_SHA" && "$status" == "SUCCESS" ]]; then
              exit 0
            fi
            if [[ "$sha" == "$GITHUB_SHA" && ( "$status" == "FAILED" || "$status" == "CRASHED" || "$status" == "REMOVED" || "$status" == "SKIPPED" ) ]]; then
              echo "::error::Railway deployment of $GITHUB_SHA ended with $status"
              exit 1
            fi
            sleep 15
          done
          echo "::error::Railway did not deploy commit $GITHUB_SHA within 15 minutes"
          exit 1
      - name: Verify production API health
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error --max-time 10 \
              https://api.keptfinance.app/health | jq -e '.status == "ok"' >/dev/null; then
              echo "Production API healthy"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Production API health check failed"
          exit 1
      - name: Trigger production Vercel deployment
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20 \
            --request POST "$VERCEL_PRODUCTION_DEPLOY_HOOK"
